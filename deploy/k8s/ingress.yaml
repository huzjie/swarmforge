apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swarmforge-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.swarmforge.example.com
      secretName: swarmforge-tls
  rules:
    - host: api.swarmforge.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: swarmforge-api
                port:
                  number: 80
