apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarmforge-api
  labels:
    app: swarmforge
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: swarmforge
      component: api
  template:
    metadata:
      labels:
        app: swarmforge
        component: api
    spec:
      containers:
        - name: api
          image: swarmforge:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: SWARMFORGE_ENV
              value: "production"
            - name: SWARMFORGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: swarmforge-secrets
                  key: secret-key
            - name: SWARMFORGE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: swarmforge-secrets
                  key: database-url
            - name: SWARMFORGE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: swarmforge-secrets
                  key: redis-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: swarmforge-api
spec:
  selector:
    app: swarmforge
    component: api
  ports:
    - port: 80
      targetPort: 8000
      name: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarmforge-worker
  labels:
    app: swarmforge
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swarmforge
      component: worker
  template:
    metadata:
      labels:
        app: swarmforge
        component: worker
    spec:
      containers:
        - name: worker
          image: swarmforge:latest
          command: ["celery", "-A", "swarmforge.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
          env:
            - name: SWARMFORGE_ENV
              value: "production"
            - name: SWARMFORGE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: swarmforge-secrets
                  key: database-url
            - name: SWARMFORGE_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: swarmforge-secrets
                  key: redis-url
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
---
apiVersion: v1
kind: Secret
metadata:
  name: swarmforge-secrets
type: Opaque
stringData:
  secret-key: "change-me-in-production"
  database-url: "postgresql+asyncpg://user:pass@postgres:5432/swarmforge"
  redis-url: "redis://redis:6379/0"
