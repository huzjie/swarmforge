replicaCount: 3
image:
  repository: swarmforge
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 8000
ingress:
  enabled: false
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
env:
  SWARMFORGE_ENV: production
  SWARMFORGE_LOG_LEVEL: INFO
secrets:
  secretKey: ""
  databaseUrl: ""
  redisUrl: ""
  openaiApiKey: ""
